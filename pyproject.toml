[project]
name = "jobradar-ai"
version = "0.1.0"
description = "Personal, evidence-based job-search intelligence engine"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27", "pydantic>=2.8", "PyYAML>=6.0", "SQLAlchemy>=2.0",
  "aiosqlite>=0.20", "psycopg[binary]>=3.2", "selectolax>=0.3",
  "jinja2>=3.1", "tenacity>=9.0", "pypdf>=5.0", "python-dotenv>=1.0",
  "typer>=0.12", "email-validator>=2.2"
]

[project.scripts]
jobradar = "jobradar.cli:app"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobradar"]
